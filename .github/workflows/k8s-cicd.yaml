# set condition for when to run the action files
on:
  push:
    branches: ["master"]

# build docker image, push dockerhub | update helm chart and push to Nexus
env:
  DOCKER_IMAGE_NAME: reactjs-devop-cicd
  NEXUS_HELM_REPO_URL: https://nexus.next-step-go.online/repository/helm-hosted/
  # Repo that contains the Helm chart (owner/repo). Use GIT_TOKEN secret if private.
  HELM_CHART_REPO: ${{ vars.HELM_CHART_REPO }}
  # Path to the chart directory inside that repo (e.g. helm-reactjs or reactjs-plants-chart)
  HELM_CHART_PATH: ${{ vars.HELM_CHART_PATH }}

jobs:
  ci-job:
    runs-on: ubuntu-latest
    environment: DOCKER_ENV
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set TAG to latest
        run: |
          echo "TAG=latest" >> $GITHUB_ENV

      - name: Show the TAG
        run: |
          echo "TAG = ${{ env.TAG }}"

      - name: Login to Dockerhub
        run: |
          echo "${{ secrets.PASSWORD }}" | docker login -u ${{ secrets.USERNAME }} --password-stdin

      - name: Build and Tag
        run: |
          docker build -t ${{ secrets.USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.TAG }} .

      - name: Push to Dockerhub
        run: |
          docker push ${{ secrets.USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.TAG }}

      - name: Logout from Dockerhub
        if: always()
        run: |
          docker logout

  # Package Helm chart with new image tag and push to Nexus
  cd-job:
    needs: ci-job
    runs-on: ubuntu-latest
    environment: HELM_ENV
    steps:
      - name: Add Commit SHA to TAG env
        run: |
          echo "TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "v3.13.0"

      - name: Install yq
        run: |
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Clone Helm chart repo
        run: |
          git clone "https://${{ secrets.GIT_TOKEN }}@github.com/${{ env.HELM_CHART_REPO }}.git" helm_repo

      - name: Update Helm chart image
        run: |
          CHART_PATH="${{ env.HELM_CHART_PATH }}"
          [ -z "$CHART_PATH" ] && CHART_PATH="helm-reactjs"
          CHART_DIR="${{ github.workspace }}/helm_repo/${CHART_PATH}"
          if [ ! -d "$CHART_DIR" ]; then
            echo "::error::Chart not found at ${CHART_PATH}. Repo contents:"
            ls -la "${{ github.workspace }}/helm_repo"
            exit 1
          fi
          echo "Update repository username/imagename"
          yq -i ".image.repository=\"${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}\"" "$CHART_DIR/values.yaml"
          echo "Update image tag"
          yq -i ".image.tag=\"${{ env.TAG }}\"" "$CHART_DIR/values.yaml"
          yq -i ".appVersion=\"${{ env.TAG }}\"" "$CHART_DIR/Chart.yaml"

      - name: Package Helm chart
        run: |
          CHART_PATH="${{ env.HELM_CHART_PATH }}"
          [ -z "$CHART_PATH" ] && CHART_PATH="helm-reactjs"
          helm package "${{ github.workspace }}/helm_repo/${CHART_PATH}"

      - name: Push Helm chart to Nexus
        env:
          NEXUS_URL: ${{ env.NEXUS_HELM_REPO_URL }}
          NEXUS_USER: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          CHART_FILE=$(ls *.tgz)
          curl -f -u "${NEXUS_USER}:${NEXUS_PASS}" \
            --upload-file "${CHART_FILE}" \
            "${NEXUS_URL}/${CHART_FILE}"

      - name: Clean up
        if: always()
        run: |
          rm -rf helm_repo
